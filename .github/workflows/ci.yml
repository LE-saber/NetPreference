name: NetPreference verify and SDK
on:
  push:
    branches: ['**']
    paths: ['cmd/**', 'internal/**', 'tests/**', 'scripts/**', 'files/**', 'packaging/**', 'openwrt/**', 'go.mod', '.github/workflows/**', 'LICENSE', 'docs/LICENSE-Go']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netpreference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false
      - run: mkdir -p dist/logs
      - name: Unit, real DNS wire, race, fuzz, LuCI and package checks
        id: core
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee dist/logs/core.txt
      - name: Install isolated kernel-lab tools
        id: kernel_tools
        run: sudo apt-get update && sudo apt-get install -y nftables conntrack iproute2
      - name: Real IPv4/IPv6 redirects, profiles, recovery and NAT66 preservation
        id: kernel
        shell: bash
        run: |
          set -o pipefail
          sudo python3 tests/netns.py 2>&1 | tee dist/logs/kernel.txt
      - name: Install pinned browser test runner
        id: browser_tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium mode-set interactions and real backend validation
        id: browser
        shell: bash
        run: |
          set -o pipefail
          python3 tests/luci_browser.py 2>&1 | tee dist/logs/browser.txt
      - name: Build the fixed r6 source for actual upgrade testing
        id: legacy
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_legacy.sh 2>&1 | tee dist/logs/legacy.txt
      - name: Capture phase outcomes
        if: always()
        env:
          CORE_RESULT: ${{ steps.core.outcome }}
          KERNEL_TOOLS_RESULT: ${{ steps.kernel_tools.outcome }}
          KERNEL_RESULT: ${{ steps.kernel.outcome }}
          BROWSER_TOOLS_RESULT: ${{ steps.browser_tools.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          LEGACY_RESULT: ${{ steps.legacy.outcome }}
        run: |
          mkdir -p dist/logs
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('dist/outcomes.json').write_text(json.dumps({k[:-7].lower():v for k,v in os.environ.items() if k.endswith('_RESULT')}))
          PY
      - name: Upload exact verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netpreference-verification-${{ github.run_id }}
          path: |
            dist/*.ipk
            dist/SHA256SUMS
            dist/build-info.json
            dist/coverage.out
            dist/outcomes.json
            dist/logs/
            dist/browser/
            dist/kernel-traffic.json
            dist/ux-generated.uci
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: netpreference-legacy-${{ github.run_id }}
          path: dist-legacy/*.ipk
          retention-days: 7

  sdk:
    needs: verify
    uses: ./.github/workflows/sdk-build.yml
    with:
      legacy_artifact: netpreference-legacy-${{ github.run_id }}

  record-failures:
    needs: [verify, sdk]
    if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && (needs.verify.result == 'failure' || needs.sdk.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: netpreference-*
          path: .ci-artifacts
      - name: One failure document and commit per failed phase
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          for report in sorted(pathlib.Path('.ci-artifacts').rglob('outcomes.json')):
              for phase,result in json.loads(report.read_text()).items():
                  if result == 'failure':
                      subprocess.run(['python3','scripts/ci_failure.py',phase,str(report.parent/'logs'/f'{phase}.txt')],check=True)
          PY

  release:
    needs: [verify, sdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: netpreference-immortalwrt-sdk-${{ github.run_id }}
          path: dist-sdk
      - name: Publish only a fully verified main push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^PKG_VERSION:=//p' openwrt/luci-app-netpreference/Makefile)
          REV=$(sed -n 's/^PKG_RELEASE:=//p' openwrt/luci-app-netpreference/Makefile)
          TAG="v$VERSION"
          (cd dist-sdk && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; never overwrite an existing release."
            exit 0
          fi
          printf '%s\n' "NetPreference $VERSION-r$REV" "" \
            "Per-device defaults, named profiles/domain sets, domain-specific IPv4/IPv6 preference and inherited A/B." \
            "Official ImmortalWrt 24.10.4 x86_64 SDK package. Verification and SDK jobs passed for $GITHUB_SHA." \
            "Includes r6 config-preserving opkg upgrade and isolated dual-stack recovery tests." \
            "DNS timing is a preference, not forced IPv6. Target-router/LuCI browser acceptance remains separate." > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist-sdk/*.ipk dist-sdk/SHA256SUMS dist-sdk/build-info.json \
            --target "$GITHUB_SHA" --title "NetPreference $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
