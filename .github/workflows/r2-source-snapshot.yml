name: R2 fixed source snapshot
on:
  push:
    branches: [feat/0.2.0-policy-profiles]
    paths: [.github/workflows/r2-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive immutable source and regression baseline
        run: |
          mkdir -p snapshot
          git archive --format=tar.gz 8b03a9adee756e053091ea0163565ca47af06099 > snapshot/r1.tar.gz
          git archive --format=tar.gz 38a69cbb529eb8fc1b820fa00d7cc439306112f4 > snapshot/r6.tar.gz
          git log -15 --oneline > snapshot/history.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netpreference-r2-fixed-sources
          path: snapshot/
          retention-days: 7
