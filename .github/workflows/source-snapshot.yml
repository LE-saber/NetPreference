name: Development source transport
on:
  push:
    branches: ['feat/0.2.0-policy-profiles']
    paths: ['.development/READY']
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and apply exact implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          root = pathlib.Path('.development')
          parts = sorted(root.glob('part-*.b64'))
          assert [p.name for p in parts] == ['part-%03d.b64' % i for i in range(4)]
          payload = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          expected = '50f736b0923bc45fd84171d04638f5a933e84b8f90a69494524fd568d07cc1f8'
          assert (root / 'READY').read_text().strip() == expected
          assert hashlib.sha256(payload).hexdigest() == expected
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'implementation.patch'
          patch.write_bytes(lzma.decompress(payload))
          paths = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          for line in paths.splitlines():
              path = line.split('\t', 2)[2]
              p = pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert path in ('.gitignore', 'README.md', 'docs/ARCHITECTURE.md') or p.parts[0] in ('files', 'internal', 'openwrt', 'scripts', 'tests'), path
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=nowarn', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=nowarn', str(patch)], check=True)
          print('Applied verified source patch:', expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .development
          git commit -m 'feat: implement 0.2.0 domain profiles and inherited preference policies'
          git push origin HEAD:feat/0.2.0-policy-profiles
